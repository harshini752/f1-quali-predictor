data:
  seasons: [2022, 2023, 2024]
  sessions: [FP1, FP2, FP3, Q]
  cache_dir: data/raw/cache
  raw_output: data/raw/all_sessions.csv
  processed_dir: data/processed

model:
  features:
    - FP1_best
    - FP2_best
    - FP3_best
    - FP1_mean
    - FP2_mean
    - FP3_mean
    - FP1_std
    - FP2_std
    - FP3_std
    - track_evolution
    - AirTemp
    - TrackTemp
    - Humidity
    - Rainfall
    - Driver_enc
    - Team_enc
    - GrandPrix_enc
    - FP1_compound_enc
    - FP2_compound_enc
    - FP3_compound_enc
  target: quali_best
  train_split: 0.8
  random_forest:
    n_estimators: 200
    random_state: 42
  gradient_boosting:
    n_estimators: 300
    learning_rate: 0.05
    random_state: 42
  ridge: {}
  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    verbosity: 0

paths:
  models_dir: models
  encoder_prefix: le_

app:
  page_title: "F1 Quali Predictor"
  defaults:
    fp1_best: 90.0
    fp2_best: 89.5
    fp3_best: 89.0
  sliders:
    air_temp:
      min: 15
      max: 40
      default: 25
    track_temp:
      min: 20
      max: 60
      default: 35
    humidity:
      min: 10
      max: 100
      default: 50
